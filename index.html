<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخاخني ستور</title>
<style>
:root{--page:#101827;--panel:#1b2940;--text:#f4f7fb;--muted:#aab7c8;--accent:#35c9a4;--line:#ffffff20}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px system-ui,Tahoma,Arial;background:radial-gradient(circle at 15% 15%,#1c4560,transparent 35%),radial-gradient(circle at 85% 80%,#3b245a,transparent 35%),var(--page);background-size:150% 150%;animation:bg 18s ease-in-out infinite alternate}
@keyframes bg{to{background-position:100% 20%,0 100%}}
header,main,footer{width:min(1100px,94%);margin:auto}
header{padding:24px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,4vw,36px)}
h2{font-size:20px}
small{color:var(--muted)}
.box,.card{background:#ffffff0c;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 35px #0003;backdrop-filter:blur(10px)}
.box{margin:14px 0}
.grid,.cards,.filters{display:grid;gap:12px}
.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:14px 0}
.card b{display:block;font-size:22px;margin-top:6px}
.filters{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:14px 0}
label{display:block;color:var(--muted);font-size:14px;margin:0 0 5px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#06251d;font-weight:700;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px)}
button.secondary{background:#293951;color:var(--text)}
button.danger{background:#ff727c;color:#310b10}
.actions,.heading{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
.table-wrap{overflow:auto}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);padding:24px}
#toast{position:fixed;bottom:18px;left:18px;background:#18263b;padding:12px 16px;border-radius:10px;border:1px solid var(--line);opacity:0;transition:.2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">الدخاخني ستور</h1>
    <small id="subtitle">متابعة الدخل والمصروفات والتحويلات</small>
  </div>
  <div class="actions">
    <button class="secondary" id="languageButton">English</button>
    <label style="margin:0">🎨
      <input id="colorPicker" type="color" value="#101827" style="width:38px;padding:2px;vertical-align:middle">
    </label>
  </div>
</header>

<main>
  <section class="filters">
    <div><label id="filterBranchLabel">فلترة الفرع</label><select id="filterBranch"></select></div>
    <div><label id="filterShiftLabel">فلترة الوردية</label><select id="filterShift"></select></div>
    <div><label id="fromLabel">من تاريخ</label><input id="fromDate" type="date"></div>
    <div><label id="toLabel">إلى تاريخ</label><input id="toDate" type="date"></div>
  </section>

  <section class="cards">
    <div class="card"><span id="incomeLabel">إجمالي الدخل</span><b id="incomeTotal">0</b></div>
    <div class="card"><span id="expenseLabel">إجمالي المصروفات</span><b id="expenseTotal">0</b></div>
    <div class="card"><span id="balanceLabel">الصافي</span><b id="balanceTotal">0</b></div>
  </section>

  <section class="box">
    <h2 id="formTitle">إضافة معاملة</h2>
    <form id="form">
      <div class="grid">
        <div><label id="typeLabel">نوع المعاملة</label>
          <select id="type">
            <option value="income">دخل</option>
            <option value="expense">مصروف</option>
            <option value="transfer">تحويل نقدي</option>
          </select>
        </div>
        <div><label id="dateLabel">التاريخ</label><input id="date" type="date" required></div>
        <div id="branchWrap"><label id="branchLabel">الفرع</label><select id="branch"></select></div>
        <div id="shiftWrap"><label id="shiftLabel">الوردية</label><select id="shift"></select></div>
        <div id="accountWrap"><label id="accountLabel">الحساب</label><select id="account"></select></div>
        <div id="fromWrap" class="hidden"><label id="fromAccountLabel">من حساب</label><select id="fromAccount"></select></div>
        <div id="toWrap" class="hidden"><label id="toAccountLabel">إلى حساب</label><select id="toAccount"></select></div>
        <div id="categoryWrap" class="hidden"><label id="categoryLabel">التصنيف</label><select id="category"></select></div>
        <div id="destinationWrap" class="hidden"><label id="destinationLabel">الوجهة / المستفيد</label><input id="destination"></div>
        <div><label id="amountLabel">المبلغ</label><input id="amount" type="number" min="0.01" step="0.01" required></div>
        <div><label id="notesLabel">ملاحظات</label><input id="notes"></div>
      </div>
      <p><button type="submit" id="saveButton">حفظ المعاملة</button></p>
    </form>
  </section>

  <section class="box">
    <div class="heading">
      <h2 id="transactionsTitle">المعاملات</h2>
      <button class="secondary" id="trashButton">سلة المحذوفات</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<footer id="footer">تصميم وتطوير Samy Aziz</footer>
<div id="toast"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyd224Ue2zeP6yYviKXHgfAcOcuJhYvjLGD8MIv-1iUTzAWfZt_Vo-E2qd3FHB-1Scg/exec";

const branches = ["ڤيب ستور","الدخاخني","المول","اسواق المدينه","طوخ"];
const accounts = ["الخزنة الرئيسية - الدخاخني","الخزنة الرئيسية - طوخ","خزنة باسم","إنستا باي الأهلي","الجمعية"];
const shifts = ["صباحي","مسائي"];
const categories = ["مشتريات","إيجار","رواتب","فواتير","جمعية","نقل","أخرى"];

const text = {
  ar:{
    title:"الدخاخني ستور",subtitle:"متابعة الدخل والمصروفات والتحويلات",
    filterBranchLabel:"فلترة الفرع",filterShiftLabel:"فلترة الوردية",fromLabel:"من تاريخ",toLabel:"إلى تاريخ",
    incomeLabel:"إجمالي الدخل",expenseLabel:"إجمالي المصروفات",balanceLabel:"الصافي",
    formTitle:"إضافة معاملة",typeLabel:"نوع المعاملة",dateLabel:"التاريخ",branchLabel:"الفرع",
    shiftLabel:"الوردية",accountLabel:"الحساب",fromAccountLabel:"من حساب",toAccountLabel:"إلى حساب",
    categoryLabel:"التصنيف",destinationLabel:"الوجهة / المستفيد",amountLabel:"المبلغ",notesLabel:"ملاحظات",
    saveButton:"حفظ المعاملة",transactionsTitle:"المعاملات",trashButton:"سلة المحذوفات",
    footer:"تصميم وتطوير Samy Aziz",all:"الكل",empty:"لا توجد معاملات",
    income:"دخل",expense:"مصروف",transfer:"تحويل نقدي",delete:"حذف",restore:"استعادة",
    permanent:"حذف نهائي",saved:"تم حفظ الحركة في الموقع. جارٍ إرسالها إلى Google Sheets…",
    columns:["التاريخ","النوع","الفرع","الوردية","الحساب / التحويل","التصنيف والوجهة","المبلغ","ملاحظات","إجراء"]
  },
  en:{
    title:"Al-Dakhakhni Store",subtitle:"Income, expenses and transfers tracker",
    filterBranchLabel:"Filter branch",filterShiftLabel:"Filter shift",fromLabel:"From date",toLabel:"To date",
    incomeLabel:"Total income",expenseLabel:"Total expenses",balanceLabel:"Net balance",
    formTitle:"Add transaction",typeLabel:"Transaction type",dateLabel:"Date",branchLabel:"Branch",
    shiftLabel:"Shift",accountLabel:"Account",fromAccountLabel:"From account",toAccountLabel:"To account",
    categoryLabel:"Category",destinationLabel:"Destination / recipient",amountLabel:"Amount",notesLabel:"Notes",
    saveButton:"Save transaction",transactionsTitle:"Transactions",trashButton:"Trash",
    footer:"Designed & Developed by Samy Aziz",all:"All",empty:"No transactions",
    income:"Income",expense:"Expense",transfer:"Cash transfer",delete:"Delete",restore:"Restore",
    permanent:"Delete permanently",saved:"Saved locally. Sending to Google Sheets…",
    columns:["Date","Type","Branch","Shift","Account / transfer","Category / destination","Amount","Notes","Action"]
  }
};

let lang=localStorage.getItem("store_lang")||"ar";
let transactions=JSON.parse(localStorage.getItem("store_transactions")||"[]");
let trash=JSON.parse(localStorage.getItem("store_trash")||"[]");
let showingTrash=false;
const $=id=>document.getElementById(id);

function saveLocal(){
  localStorage.setItem("store_transactions",JSON.stringify(transactions));
  localStorage.setItem("store_trash",JSON.stringify(trash));
}
function sendToSheet(data){
  fetch(WEB_APP_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  }).catch(()=>notify(lang==="ar"?"تعذر إرسال البيانات":"Could not send data"));
}
function notify(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  setTimeout(()=>$("toast").classList.remove("show"),3000);
}
function fillSelect(id,items,includeAll=false){
  const select=$(id);
  select.innerHTML="";
  if(includeAll)select.add(new Option(text[lang].all,""));
  items.forEach(item=>select.add(new Option(item,item)));
}
function setupLists(){
  fillSelect("branch",branches);
  fillSelect("filterBranch",branches,true);
  fillSelect("shift",shifts);
  fillSelect("filterShift",shifts,true);
  fillSelect("account",$("type").value==="expense"?accounts:[...branches,...accounts]);
  fillSelect("fromAccount",accounts);
  fillSelect("toAccount",accounts);
  fillSelect("category",categories);
}
function updateFields(){
  const type=$("type").value;
  $("branchWrap").classList.toggle("hidden",type!=="income");
  $("shiftWrap").classList.toggle("hidden",type!=="income");
  $("accountWrap").classList.toggle("hidden",type==="transfer");
  $("fromWrap").classList.toggle("hidden",type!=="transfer");
  $("toWrap").classList.toggle("hidden",type!=="transfer");
  $("categoryWrap").classList.toggle("hidden",type!=="expense");
  $("destinationWrap").classList.toggle("hidden",type!=="expense");
  fillSelect("account",type==="expense"?accounts:[...branches,...accounts]);
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function filteredTransactions(){
  const branch=$("filterBranch").value,shift=$("filterShift").value;
  const from=$("fromDate").value,to=$("toDate").value;
  return transactions.filter(x=>
    (!branch||x.branch===branch)&&(!shift||x.shift===shift)&&
    (!from||x.date>=from)&&(!to||x.date<=to)
  );
}
function render(){
  const t=text[lang];
  const list=showingTrash?trash:filteredTransactions();
  $("rows").innerHTML="";
  if(!list.length)$("rows").innerHTML=`<tr><td colspan="9">${t.empty}</td></tr>`;

  [...list].reverse().forEach(item=>{
    const accountText=item.type==="transfer"
      ?`${item.fromAccount} → ${item.toAccount}`
      :(item.account||"");
    const details=[item.category,item.destination].filter(Boolean).join(" / ");
    const actionButtons=showingTrash
      ?`<button class="secondary" data-action="restore" data-id="${escapeHtml(item.id)}">${t.restore}</button>
        <button class="danger" data-action="permanent" data-id="${escapeHtml(item.id)}">${t.permanent}</button>`
      :`<button class="danger" data-action="delete" data-id="${escapeHtml(item.id)}">${t.delete}</button>`;

    $("rows").insertAdjacentHTML("beforeend",`<tr>
      <td>${escapeHtml(item.date)}</td>
      <td>${t[item.type]||escapeHtml(item.type)}</td>
      <td>${escapeHtml(item.branch)}</td>
      <td>${escapeHtml(item.shift)}</td>
      <td>${escapeHtml(accountText)}</td>
      <td>${escapeHtml(details)}</td>
      <td>${Number(item.amount||0).toLocaleString()}</td>
      <td>${escapeHtml(item.notes)}</td>
      <td>${actionButtons}</td>
    </tr>`);
  });

  const listForTotals=filteredTransactions();
  const income=listForTotals.filter(x=>x.type==="income").reduce((n,x)=>n+Number(x.amount||0),0);
  const expense=listForTotals.filter(x=>x.type==="expense").reduce((n,x)=>n+Number(x.amount||0),0);
  $("incomeTotal").textContent=income.toLocaleString();
  $("expenseTotal").textContent=expense.toLocaleString();
  $("balanceTotal").textContent=(income-expense).toLocaleString();
}
function applyLanguage(){
  const t=text[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  Object.keys(t).forEach(key=>{
    if($(key)&&typeof t[key]==="string")$(key).textContent=t[key];
  });
  $("languageButton").textContent=lang==="ar"?"English":"العربية";
  $("tableHead").innerHTML=t.columns.map(x=>`<th>${x}</th>`).join("");
  $("type").options[0].text=t.income;
  $("type").options[1].text=t.expense;
  $("type").options[2].text=t.transfer;
  setupLists();
  updateFields();
  render();
}

$("type").addEventListener("change",updateFields);

$("form").addEventListener("submit",event=>{
  event.preventDefault();
  const type=$("type").value;
  const item={
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
    type,
    date:$("date").value,
    amount:Number($("amount").value),
    branch:type==="income"?$("branch").value:"",
    shift:type==="income"?$("shift").value:"",
    account:type!=="transfer"?$("account").value:"",
    fromAccount:type==="transfer"?$("fromAccount").value:"",
    toAccount:type==="transfer"?$("toAccount").value:"",
    category:type==="expense"?$("category").value:"",
    destination:type==="expense"?$("destination").value:"",
    notes:$("notes").value,
    createdAt:new Date().toISOString()
  };

  if(type==="transfer"&&item.fromAccount===item.toAccount){
    notify(lang==="ar"?"اختَر حسابين مختلفين للتحويل":"Choose two different accounts");
    return;
  }

  transactions.push(item);
  saveLocal();
  sendToSheet({action:"create",...item});
  event.target.reset();
  $("date").value=new Date().toISOString().slice(0,10);
  updateFields();
  render();
  notify(text[lang].saved);
});

$("rows").addEventListener("click",event=>{
  const button=event.target.closest("button");
  if(!button)return;

  const id=button.dataset.id;
  const action=button.dataset.action;

  if(action==="delete"){
    const item=transactions.find(x=>x.id===id);
    if(!item)return;
    transactions=transactions.filter(x=>x.id!==id);
    trash.push(item);
    saveLocal();
    sendToSheet({action:"delete",id:item.id,type:item.type,date:item.date,amount:item.amount});
  }else if(action==="restore"){
    const item=trash.find(x=>x.id===id);
    if(!item)return;
    trash=trash.filter(x=>x.id!==id);
    transactions.push(item);
    saveLocal();
    sendToSheet({action:"restore",...item});
  }else if(action==="permanent"){
    if(!confirm(lang==="ar"?"حذف نهائيًا؟":"Delete permanently?"))return;
    trash=trash.filter(x=>x.id!==id);
    saveLocal();
    sendToSheet({action:"permanent_delete",id});
  }
  render();
});

$("trashButton").addEventListener("click",()=>{
  showingTrash=!showingTrash;
  $("trashButton").textContent=showingTrash
    ?(lang==="ar"?"عرض المعاملات":"Show transactions")
    :text[lang].trashButton;
  render();
});

["filterBranch","filterShift","fromDate","toDate"].forEach(id=>{
  $(id).addEventListener("change",render);
});

$("languageButton").addEventListener("click",()=>{
  lang=lang==="ar"?"en":"ar";
  localStorage.setItem("store_lang",lang);
  applyLanguage();
});

$("colorPicker").value=localStorage.getItem("store_color")||"#101827";
document.documentElement.style.setProperty("--page",$("colorPicker").value);
$("colorPicker").addEventListener("input",event=>{
  document.documentElement.style.setProperty("--page",event.target.value);
  localStorage.setItem("store_color",event.target.value);
});

$("date").value=new Date().toISOString().slice(0,10);
applyLanguage();
</script>
</body>
</html>
