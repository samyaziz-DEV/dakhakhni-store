<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدخاخني ستور | الحسابات</title>

  <style>
    :root {
      --page-color: #eef2ff;
      --card: rgba(255, 255, 255, .93);
      --ink: #182033;
      --muted: #6b7280;
      --primary: #5b5bd6;
      --primary-dark: #4141ad;
      --green: #16865b;
      --red: #c13b4a;
      --line: #e5e7eb;
      --shadow: 0 12px 35px rgba(32, 42, 80, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(91,91,214,.17), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(27,174,138,.14), transparent 28%),
        var(--page-color);
      background-attachment: fixed;
      transition: background-color .35s, color .25s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .35;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.5), transparent 65%);
      background-size: 200% 200%;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { background-position: 0 0; }
      to { background-position: 100% 100%; }
    }

    .wrap { width: min(1200px, 94%); margin: 24px auto; }

    header, .card, .stat {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border-radius: 18px;
    }

    header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      animation: appear .5s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { margin: 0; font-size: clamp(21px, 4vw, 30px); }
    .subtitle { color: var(--muted); margin-top: 7px; font-size: 14px; }

    .toolbar, .actions, .filters, .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, .color-label {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      transition: transform .2s, filter .2s, background .2s;
    }

    button:hover { transform: translateY(-2px); filter: brightness(.97); }
    button:active { transform: scale(.98); }

    .btn-primary { color: white; background: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-light { color: var(--ink); background: #eef0f7; }
    .btn-danger { color: white; background: var(--red); }
    .btn-green { color: white; background: var(--green); }
    .btn-small { padding: 7px 10px; font-size: 13px; }

    .color-label {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      background: #eef0f7;
      color: var(--ink);
    }

    input[type="color"] {
      width: 27px; height: 27px; padding: 0; border: 0;
      background: transparent; cursor: pointer;
    }

    .stats { margin: 18px 0; }
    .stat { flex: 1; min-width: 160px; padding: 16px 18px; transition: transform .2s; }
    .stat:hover { transform: translateY(-3px); }
    .stat-label { color: var(--muted); font-size: 14px; }
    .stat-value { font-size: 23px; font-weight: bold; margin-top: 8px; }
    .income-value { color: var(--green); }
    .expense-value { color: var(--red); }

    .card { padding: 18px; margin-bottom: 18px; }
    .card h2 { margin: 0 0 16px; font-size: 19px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
    }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      background: white;
      color: #172033;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91,91,214,.12);
    }

    textarea { resize: vertical; min-height: 42px; }
    .wide { grid-column: span 2; }
    .form-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

    .filters { margin-bottom: 14px; }
    .filters > * { flex: 1; min-width: 145px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 13px; white-space: nowrap; }
    td { font-size: 14px; }
    tbody tr { transition: background .2s; }
    tbody tr:hover { background: rgba(91,91,214,.045); }

    .tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 20px;
      background: #eef0f7;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag.income { color: var(--green); background: #e8f7ef; }
    .tag.expense { color: var(--red); background: #fff0f1; }
    .tag.transfer { color: #4d57bb; background: #eef0ff; }
    .empty { text-align: center; color: var(--muted); padding: 25px; }

    footer { text-align: center; color: var(--muted); padding: 12px 8px 22px; font-size: 14px; }

    @media (max-width: 760px) {
      .form-grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .wide { grid-column: span 2; }
      .stat { min-width: 130px; }
    }
    @media (max-width: 430px) {
      .form-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .wrap { width: 96%; margin: 12px auto; }
      header, .card { padding: 14px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div>
        <h1 id="pageTitle">الدخاخني ستور</h1>
        <div class="subtitle" id="subtitle">نظام متابعة الدخل والمصروفات والتحويلات</div>
      </div>
      <div class="toolbar">
        <button class="btn-light" id="languageBtn" type="button">English</button>
        <label class="color-label" for="pageColor">
          <span id="colorText">لون الصفحة</span>
          <input id="pageColor" type="color" value="#eef2ff" aria-label="لون الصفحة">
        </label>
        <button class="btn-light" id="trashToggle" type="button">سلة المحذوفات</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label" id="incomeLabel">إجمالي الدخل</div>
        <div class="stat-value income-value" id="totalIncome">0</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="expenseLabel">إجمالي المصروفات</div>
        <div class="stat-value expense-value" id="totalExpense">0</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="balanceLabel">الصافي</div>
        <div class="stat-value" id="netBalance">0</div>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">إضافة عملية</h2>
      <form id="transactionForm">
        <div class="form-grid">
          <div>
            <label for="date" id="dateLabel">التاريخ</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label for="branch" id="branchLabel">الفرع</label>
            <select id="branch" required></select>
          </div>
          <div>
            <label for="shift" id="shiftLabel">الوردية</label>
            <select id="shift" required></select>
          </div>
          <div>
            <label for="type" id="typeLabel">نوع العملية</label>
            <select id="type" required></select>
          </div>
          <div id="categoryBox">
            <label for="category" id="categoryLabel">التصنيف</label>
            <select id="category"></select>
          </div>
          <div id="accountBox">
            <label for="account" id="accountLabel">الحساب</label>
            <select id="account"></select>
          </div>
          <div id="fromBox" hidden>
            <label for="fromAccount" id="fromLabel">من حساب</label>
            <select id="fromAccount"></select>
          </div>
          <div id="toBox" hidden>
            <label for="toAccount" id="toLabel">إلى حساب</label>
            <select id="toAccount"></select>
          </div>
          <div>
            <label for="amount" id="amountLabel">المبلغ</label>
            <input id="amount" type="number" min="0.01" step="0.01" required>
          </div>
          <div class="wide">
            <label for="notes" id="notesLabel">ملاحظات</label>
            <input id="notes" type="text" placeholder="اختياري">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" type="submit" id="submitBtn">حفظ العملية</button>
          <button class="btn-light" type="reset" id="resetBtn">مسح الحقول</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 id="listTitle">العمليات</h2>
      <div class="filters">
        <input id="filterStart" type="date" aria-label="من تاريخ">
        <input id="filterEnd" type="date" aria-label="إلى تاريخ">
        <select id="filterBranch"></select>
        <select id="filterShift"></select>
        <select id="filterType"></select>
        <button class="btn-light" id="clearFilters" type="button">مسح الفلاتر</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="thDate">التاريخ</th>
              <th id="thBranch">الفرع</th>
              <th id="thShift">الوردية</th>
              <th id="thType">النوع</th>
              <th id="thDetails">التفاصيل</th>
              <th id="thAmount">المبلغ</th>
              <th id="thNotes">ملاحظات</th>
              <th id="thActions">إجراءات</th>
            </tr>
          </thead>
          <tbody id="transactionsBody"></tbody>
        </table>
      </div>
    </section>

    <footer id="footerText">تصميم وتطوير Samy Aziz</footer>
  </main>

  <script>
    // ضع هنا رابط Web App المنشور من Google Apps Script
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyJNLbIkc1iKxqrw6RbSoeUstK-Uhr9KHu_GtrTqtdWjXRXrhrEQEvci5QIfvI5MQFjRA/exec";

    const STORAGE_KEY = "dakhakhni_transactions_v1";
    const TRASH_KEY = "dakhakhni_trash_v1";
    const LANG_KEY = "dakhakhni_language";
    const COLOR_KEY = "dakhakhni_page_color";

    const branches = ["ڤيب ستور", "الدخاخني", "المول", "اسواق المدينه", "طوخ"];
    const shifts = ["صباحي", "مسائي"];
    const transactionTypes = ["دخل", "مصروف", "تحويل"];

    const incomeAccounts = [
      "الخزنة الرئيسية - الدخاخني",
      "الخزنة الرئيسية - طوخ",
      "خزنة باسم",
      "إنستا باي الأهلي"
    ];

    // حسابات المصروفات: يمكن اختيار أي خزنة أو حساب بنك للدفع منه
    const expenseAccounts = [
      "الخزنة الرئيسية - الدخاخني",
      "الخزنة الرئيسية - طوخ",
      "خزنة باسم",
      "إنستا باي الأهلي",
      "الجمعية"
    ];

    const transferAccounts = [...new Set([
      ...incomeAccounts,
      "الجمعية"
    ])];

    const categories = [
      "بضاعة",
      "إيجار",
      "مرتبات",
      "مواصلات",
      "فواتير",
      "جمعية",
      "صيانة",
      "أخرى"
    ];

    const translations = {
      ar: {
        pageTitle: "الدخاخني ستور",
        subtitle: "نظام متابعة الدخل والمصروفات والتحويلات",
        colorText: "لون الصفحة",
        trashToggle: "سلة المحذوفات",
        incomeLabel: "إجمالي الدخل",
        expenseLabel: "إجمالي المصروفات",
        balanceLabel: "الصافي",
        formTitle: "إضافة عملية",
        dateLabel: "التاريخ",
        branchLabel: "الفرع",
        shiftLabel: "الوردية",
        typeLabel: "نوع العملية",
        categoryLabel: "التصنيف",
        accountLabel: "الحساب / جهة الصرف",
        fromLabel: "من حساب",
        toLabel: "إلى حساب",
        amountLabel: "المبلغ",
        notesLabel: "ملاحظات",
        submitBtn: "حفظ العملية",
        resetBtn: "مسح الحقول",
        listTitle: "العمليات",
        thDate: "التاريخ",
        thBranch: "الفرع",
        thShift: "الوردية",
        thType: "النوع",
        thDetails: "التفاصيل",
        thAmount: "المبلغ",
        thNotes: "ملاحظات",
        thActions: "إجراءات",
        clearFilters: "مسح الفلاتر",
        footerText: "تصميم وتطوير Samy Aziz",
        allBranches: "كل الفروع",
        allShifts: "كل الورديات",
        allTypes: "كل الأنواع",
        income: "دخل",
        expense: "مصروف",
        transfer: "تحويل",
        noRows: "لا توجد عمليات لعرضها.",
        delete: "حذف",
        restore: "استعادة",
        permanentDelete: "حذف نهائي",
        saved: "تم حفظ العملية على الجهاز.",
        sent: "تم إرسال العملية إلى Google Sheets.",
        trash: "سلة المحذوفات",
        normal: "العمليات",
        notesPlaceholder: "اختياري",
        startPlaceholder: "من تاريخ",
        endPlaceholder: "إلى تاريخ"
      },
      en: {
        pageTitle: "Al-Dakhakhni Store",
        subtitle: "Income, expenses, and transfers tracker",
        colorText: "Page color",
        trashToggle: "Trash",
        incomeLabel: "Total income",
        expenseLabel: "Total expenses",
        balanceLabel: "Net balance",
        formTitle: "Add transaction",
        dateLabel: "Date",
        branchLabel: "Branch",
        shiftLabel: "Shift",
        typeLabel: "Transaction type",
        categoryLabel: "Category",
        accountLabel: "Account / Paid from",
        fromLabel: "From account",
        toLabel: "To account",
        amountLabel: "Amount",
        notesLabel: "Notes",
        submitBtn: "Save transaction",
        resetBtn: "Clear form",
        listTitle: "Transactions",
        thDate: "Date",
        thBranch: "Branch",
        thShift: "Shift",
        thType: "Type",
        thDetails: "Details",
        thAmount: "Amount",
        thNotes: "Notes",
        thActions: "Actions",
        clearFilters: "Clear filters",
        footerText: "Designed & Developed by Samy Aziz",
        allBranches: "All branches",
        allShifts: "All shifts",
        allTypes: "All types",
        income: "Income",
        expense: "Expense",
        transfer: "Transfer",
        noRows: "No transactions to display.",
        delete: "Delete",
        restore: "Restore",
        permanentDelete: "Delete permanently",
        saved: "Transaction saved on this device.",
        sent: "Transaction sent to Google Sheets.",
        trash: "Trash",
        normal: "Transactions",
        notesPlaceholder: "Optional",
        startPlaceholder: "Start date",
        endPlaceholder: "End date"
      }
    };

    let language = localStorage.getItem(LANG_KEY) || "ar";
    let showingTrash = false;
    let transactions = loadArray(STORAGE_KEY);
    let trash = loadArray(TRASH_KEY);

    function loadArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
    }

    function option(value, text) {
      const el = document.createElement("option");
      el.value = value;
      el.textContent = text;
      return el;
    }

    function fillSelect(id, values, firstText) {
      const select = document.getElementById(id);
      select.replaceChildren();
      if (firstText !== undefined) select.appendChild(option("", firstText));
      values.forEach(value => select.appendChild(option(value, value)));
    }

    function fillStaticSelects() {
      fillSelect("branch", branches);
      fillSelect("shift", shifts);
      fillSelect("type", transactionTypes);
      fillSelect("category", categories);
      fillSelect("account", incomeAccounts);
      fillSelect("fromAccount", transferAccounts);
      fillSelect("toAccount", transferAccounts);

      fillSelect("filterBranch", branches, translations[language].allBranches);
      fillSelect("filterShift", shifts, translations[language].allShifts);
      fillSelect("filterType", transactionTypes, translations[language].allTypes);
    }

    function setLanguage() {
      const t = translations[language];
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

      Object.keys(t).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = t[id];
      });

      document.getElementById("languageBtn").textContent =
        language === "ar" ? "English" : "العربية";

      document.getElementById("notes").placeholder = t.notesPlaceholder;
      document.getElementById("filterStart").title = t.startPlaceholder;
      document.getElementById("filterEnd").title = t.endPlaceholder;
      fillStaticSelects();
      updateAccountFields();
      render();
    }

    function updateAccountFields() {
      const type = document.getElementById("type").value;
      const categoryBox = document.getElementById("categoryBox");
      const accountBox = document.getElementById("accountBox");
      const fromBox = document.getElementById("fromBox");
      const toBox = document.getElementById("toBox");
      const accountSelect = document.getElementById("account");

      fromBox.hidden = type !== "تحويل";
      toBox.hidden = type !== "تحويل";
      categoryBox.hidden = type === "تحويل";
      accountBox.hidden = type === "تحويل";

      if (type === "مصروف") {
        fillSelect("account", expenseAccounts);
      } else {
        fillSelect("account", incomeAccounts);
      }

      // استخدام أول حساب كقيمة مبدئية
      if (!accountSelect.value && accountSelect.options.length) {
        accountSelect.selectedIndex = 0;
      }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function typeLabel(type) {
      const t = translations[language];
      if (type === "دخل") return t.income;
      if (type === "مصروف") return t.expense;
      if (type === "تحويل") return t.transfer;
      return type || "";
    }

    function filteredTransactions() {
      const start = document.getElementById("filterStart").value;
      const end = document.getElementById("filterEnd").value;
      const branch = document.getElementById("filterBranch").value;
      const shift = document.getElementById("filterShift").value;
      const type = document.getElementById("filterType").value;

      return (showingTrash ? trash : transactions).filter(item => {
        if (start && item.date < start) return false;
        if (end && item.date > end) return false;
        if (branch && item.branch !== branch) return false;
        if (shift && item.shift !== shift) return false;
        if (type && item.type !== type) return false;
        return true;
      });
    }

    function render() {
      const t = translations[language];
      const body = document.getElementById("transactionsBody");
      const rows = filteredTransactions();

      if (!showingTrash) {
        const totalIncome = transactions
          .filter(x => x.type === "دخل")
          .reduce((sum, x) => sum + Number(x.amount || 0), 0);
        const totalExpense = transactions
          .filter(x => x.type === "مصروف")
          .reduce((sum, x) => sum + Number(x.amount || 0), 0);

        document.getElementById("totalIncome").textContent = money(totalIncome);
        document.getElementById("totalExpense").textContent = money(totalExpense);
        document.getElementById("netBalance").textContent = money(totalIncome - totalExpense);
      }

      document.getElementById("listTitle").textContent =
        showingTrash ? t.trash : t.normal;

      if (!rows.length) {
        body.innerHTML = `<tr><td class="empty" colspan="8">${escapeHTML(t.noRows)}</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(item => {
        let details = "";
        if (item.type === "تحويل") {
          details = `${escapeHTML(item.fromAccount)} ← ${escapeHTML(item.toAccount)}`;
        } else if (item.type === "مصروف") {
          details = `${escapeHTML(item.category)} — ${escapeHTML(item.account)}`;
        } else {
          details = `${escapeHTML(item.account)}`;
        }

        const tagClass = item.type === "دخل" ? "income" :
          item.type === "مصروف" ? "expense" : "transfer";

        const controls = showingTrash
          ? `<button class="btn-green btn-small" data-action="restore" data-id="${escapeHTML(item.id)}">${escapeHTML(t.restore)}</button>
             <button class="btn-danger btn-small" data-action="purge" data-id="${escapeHTML(item.id)}">${escapeHTML(t.permanentDelete)}</button>`
          : `<button class="btn-danger btn-small" data-action="delete" data-id="${escapeHTML(item.id)}">${escapeHTML(t.delete)}</button>`;

        return `<tr>
          <td>${escapeHTML(item.date)}</td>
          <td>${escapeHTML(item.branch)}</td>
          <td>${escapeHTML(item.shift)}</td>
          <td><span class="tag ${tagClass}">${escapeHTML(typeLabel(item.type))}</span></td>
          <td>${details}</td>
          <td>${money(Number(item.amount || 0))}</td>
          <td>${escapeHTML(item.notes)}</td>
          <td><div class="actions">${controls}</div></td>
        </tr>`;
      }).join("");
    }

    function money(value) {
      return new Intl.NumberFormat(language === "ar" ? "ar-EG" : "en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(value);
    }

    document.getElementById("type").addEventListener("change", updateAccountFields);

    document.getElementById("transactionForm").addEventListener("submit", async event => {
      event.preventDefault();

      const type = document.getElementById("type").value;
      const item = {
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
        date: document.getElementById("date").value,
        branch: document.getElementById("branch").value,
        shift: document.getElementById("shift").value,
        type,
        category: type === "تحويل" ? "" : document.getElementById("category").value,
        account: type === "تحويل" ? "" : document.getElementById("account").value,
        fromAccount: type === "تحويل" ? document.getElementById("fromAccount").value : "",
        toAccount: type === "تحويل" ? document.getElementById("toAccount").value : "",
        amount: Number(document.getElementById("amount").value),
        notes: document.getElementById("notes").value.trim()
      };

      if (type === "تحويل" && item.fromAccount === item.toAccount) {
        alert(language === "ar" ? "اختار حسابين مختلفين للتحويل." : "Choose two different accounts.");
        return;
      }

      transactions.unshift(item);
      saveData();
      render();

      // Apps Script يستقبل البيانات كنص JSON؛ no-cors يمنع قراءة رد الخادم من المتصفح.
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(item)
        });
      } catch (error) {
        console.error("تعذر إرسال العملية إلى Google Sheets:", error);
      }

      alert(translations[language].saved);
      event.target.reset();
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      updateAccountFields();
    });

    document.getElementById("transactionsBody").addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === "delete") {
        const index = transactions.findIndex(item => item.id === id);
        if (index !== -1) trash.unshift(transactions.splice(index, 1)[0]);
      } else if (action === "restore") {
        const index = trash.findIndex(item => item.id === id);
        if (index !== -1) transactions.unshift(trash.splice(index, 1)[0]);
      } else if (action === "purge") {
        trash = trash.filter(item => item.id !== id);
      }

      saveData();
      render();
    });

    document.getElementById("languageBtn").addEventListener("click", () => {
      language = language === "ar" ? "en" : "ar";
      localStorage.setItem(LANG_KEY, language);
      setLanguage();
    });

    document.getElementById("trashToggle").addEventListener("click", () => {
      showingTrash = !showingTrash;
      render();
    });

    document.getElementById("pageColor").addEventListener("input", event => {
      document.documentElement.style.setProperty("--page-color", event.target.value);
      localStorage.setItem(COLOR_KEY, event.target.value);
    });

    document.getElementById("clearFilters").addEventListener("click", () => {
      document.getElementById("filterStart").value = "";
      document.getElementById("filterEnd").value = "";
      document.getElementById("filterBranch").value = "";
      document.getElementById("filterShift").value = "";
      document.getElementById("filterType").value = "";
      render();
    });

    ["filterStart", "filterEnd", "filterBranch", "filterShift", "filterType"]
      .forEach(id => document.getElementById(id).addEventListener("change", render));

    const savedColor = localStorage.getItem(COLOR_KEY);
    if (savedColor) {
      document.documentElement.style.setProperty("--page-color", savedColor);
      document.getElementById("pageColor").value = savedColor;
    }

    document.getElementById("date").value = new Date().toISOString().slice(0, 10);
    fillStaticSelects();
    setLanguage();
    updateAccountFields();
    render();
  </script>
</body>
</html>
